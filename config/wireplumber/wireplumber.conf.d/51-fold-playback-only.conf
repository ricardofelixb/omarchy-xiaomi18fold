# The phone's virtio-snd plays, but the Android Terminal app never answers capture requests: opening the
# capture PCM times out. ACP probing opens every PCM and stalls on it, so skip ACP and drop the capture node.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
  # Without ACP the sink opens hw:0,0 at the PCM's maximum (64 channels). The host never answers that
  # set_params, the sink dies with "Connection timed out" and virtio-snd stays wedged until the VM reboots.
  # S16_LE, 48 kHz, 2 channels is what plays on this card.
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.position = [ FL, FR ]
        audio.rate = 48000
        audio.format = "S16LE"
      }
    }
  }
]
