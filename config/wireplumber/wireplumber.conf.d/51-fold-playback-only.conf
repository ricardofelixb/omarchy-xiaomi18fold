# The phone's virtio-snd plays, but the Android Terminal app never answers capture requests: opening the
# capture PCM times out. ACP probing opens every PCM and stalls on it, so skip ACP and drop the capture node.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
